<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Sahil Kumar Ekka — Illustrator and character designer focused on concept art, digital illustration, and visual storytelling."
    />
    <title>Sahil Kumar Ekka</title>
    <link rel="icon" href="assets/images/profile/sahil-new.jpe" />
    <link rel="stylesheet" href="css/site.css" />
    <script src="js/site.js" defer></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

  <body>
    <header class="topline">
      <a href="index.html">SAHIL KUMAR EKKA</a
      ><span class="top-role">Illustrator &amp; Character Designer</span>
      <div class="top-right"></div>
    </header>
    <main class="home">
      <h1 class="hero-name">Sahil Kumar Ekka</h1>
      <div class="tile-grid">
        <a class="tile about-tile" href="pages/about.html"
          ><img
            class="tile-thumbnail"
            src="assets/images/thumbnails/sahil-about-thumbnail.png"
            alt=""
            aria-hidden="true"
          /><span class="tile-label">About</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile portfolio-tile" href="pages/portfolio.html"
          ><img
            class="tile-thumbnail"
            src="assets/images/thumbnails/sahil-portfolio-thumbnail.png"
            alt=""
            aria-hidden="true"
          /><span class="tile-label">Portfolio</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile contact-tile" href="pages/contact.html"
          ><img
            class="tile-thumbnail"
            src="assets/images/thumbnails/sahil-contacts-thumbnail.png"
            alt=""
            aria-hidden="true"
          /><span class="tile-label">Contact</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span
        ></a>
        <div class="tile portrait-tile" aria-label="Sahil Kumar Ekka profile picture">
          <img src="assets/images/profile/sahil-new.jpe" alt="Sahil Kumar Ekka" />
        </div>
        <a class="tile tools-tile" href="pages/skills.html"
          ><div class="tool-icons">
            <span class="tool-icon">Ps</span
            ><span class="tool-icon">Kr</span>
          </div>
          <span class="tile-label">Tools & Skills</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile resume-tile" href="pages/resume.html"
          ><img
            class="tile-thumbnail"
            src="assets/images/thumbnails/sahil-resume-thumbnail.png"
            alt=""
            aria-hidden="true"
          /><span class="tile-label">Resume</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span
        ></a>
      </div>
      <p class="home-note">
        CONCEPT ART · CHARACTER DESIGN · DIGITAL ILLUSTRATION
      </p>
    </main>
    <footer class="footer">
      <span>SAHIL KUMAR EKKA · ART PORTFOLIO</span
      ><span>© <span id="year">2026</span> SAHIL KUMAR EKKA</span
      ><a href="pages/contact.html"
        >CONTACT
        <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon
      ></a>
    </footer>
